#cloud-config
# Ubuntu 24.04 autoinstall (cloud-init "user-data") — generated by ClusterOne.
# The installer fetches this from the embedded HTTP server via a per-host
# signed URL; ${vars} are substituted at render time.
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  identity:
    realname: "ClusterOne Operator"
    username: clusterone
    hostname: ${hostname}
    # OPEN-SSH-PASSWORD: rendered from the OS Profile's vault-encrypted root_password.
    # Ubuntu installer wants the password as a SHA-512 crypt hash; in
    # production ClusterOne pre-hashes via passlib before substitution.
    password: ${root_password}
  ssh:
    install-server: true
    allow-pw: true
    authorized-keys:
      - ${ssh_authorized_keys}
  storage:
    layout:
      name: direct
      match:
        # Targeted by serial when the BMC reported one (stable across the
        # BMC-vs-host enumeration mismatch); falls back to device path only
        # when no serial is available.
        ${disk_match}
  packages:
    - openssh-server
    - chrony
    - sudo
  late-commands:
    - curtin in-target -- systemctl enable ssh
